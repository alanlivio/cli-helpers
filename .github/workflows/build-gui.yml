name: Build GUI

on:
  push:
    paths:
      - "gui/**"
      - ".github/workflows/build-gui.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gui-exe:
    name: Build Windows GUI Executable
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: pwsh
        run: |
          Install-Module -Name ps2exe -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Compile GUI to Executable
        shell: pwsh
        run: |
          Invoke-ps2exe -inputFile .\gui\gui.ps1 -outputFile .\gui\cli-helpers-gui.exe -noConsole -sta -title "cli-helpers GUI runner" -description "CLI Helpers GUI Runner" -company "alanlivio" -product "cli-helpers GUI runner" -version "1.0.0.0"

      - name: Upload GUI Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-helpers-gui-windows
          path: gui/cli-helpers-gui.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gui/cli-helpers-gui.exe
