name: Build GUI
on:
  push:
    paths:
      - "gui/**"
      - ".github/workflows/build-gui.yml"
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-build-gui:
    name: Test and Build GUI
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make deps
      - name: Run unit tests
        run: make test
      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile gui/gui.py --name cli-helpers-gui --distpath gui/dist
          Compress-Archive -Path gui/dist/cli-helpers-gui.exe -DestinationPath gui/cli-helpers-gui-windows-x64.zip -Force
      - name: Upload GUI Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-helpers-gui-windows
          path: |
            gui/dist/cli-helpers-gui.exe
            gui/cli-helpers-gui-windows-x64.zip
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gui/dist/cli-helpers-gui.exe
            gui/cli-helpers-gui-windows-x64.zip
