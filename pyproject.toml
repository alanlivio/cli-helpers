[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-profile-helpers"
description = "shell-profile-helpers provides an extensible cross-shell library of Bash/Zsh and PowerShell helpers to set up and manage your Unix/Windows environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials",
    "FluentQt>=1.9.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "pytest",
]

[project.scripts]
shell-profile-helpers = "gui.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gui*"]

[tool.setuptools.package-data]
gui = ["resources/*"]

[tool.setuptools.dynamic]
version = { attr = "gui.version.__version__" }
