[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-helpers"
description = "cli-helpers provides an extensible library of bash and powershell scripts to easily setup and use your unix/windows environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials",
    "FluentQt>=1.9.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "pytest",
]

[project.scripts]
cli-helpers = "cli_helpers.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli_helpers*"]

[tool.setuptools.package-data]
cli_helpers = ["resources/*"]

[tool.setuptools.dynamic]
version = { attr = "cli_helpers.version.__version__" }

